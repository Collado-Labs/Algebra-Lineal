{% comment %}Interruptor «En el documento» de una sección, un ejercicio o una referencia (botón del formulario #op): una hoja con la esquina doblada, llena si entra en el futuro PDF y tachada si queda fuera. No se parece a las casillas de elegir. Excluir no borra nada.{% endcomment %}
<button class="incluir" type="submit" form="op" name="op" value="incluir:{{ tabla }}:{{ ident }}:{% if activo %}0{% else %}1{% endif %}" aria-pressed="{% if activo %}true{% else %}false{% endif %}" data-clave="incluir-{{ tabla }}-{{ ident }}" title="{% if activo %}En el documento: pulsa para dejarlo fuera (no se borra){% else %}Fuera del documento: pulsa para incluirlo{% endif %}">
    <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">{% if activo %}<path d="M5 2.5h6.5L15 6v11.5H5z" fill="currentColor" opacity=".22"/><path d="M5 2.5h6.5L15 6v11.5H5zM11.5 2.5V6H15M7.5 10h5M7.5 13h5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>{% else %}<path d="M5 2.5h6.5L15 6v11.5H5zM11.5 2.5V6H15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="2.2 1.6"/><path d="M3.5 17.5 16.5 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>{% endif %}</svg>
    {% if activo %}<span class="sr-only">En el documento</span>{% else %}<span class="incluir-texto">Fuera</span><span class="sr-only"> del documento</span>{% endif %}<span class="sr-only">: {{ nombre }}</span>
</button>
