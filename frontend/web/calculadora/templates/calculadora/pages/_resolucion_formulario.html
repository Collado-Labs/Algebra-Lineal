<form id="renombrar-{{ r.clave }}" method="post" action="{{ pagina }}" hidden>{% csrf_token %}<input type="hidden" name="accion" value="renombrar"><input type="hidden" name="id" value="{{ r.id }}"><input type="hidden" name="filtros" value="{{ consulta_filtros }}"><input type="hidden" name="volver" value="{{ volver }}"></form>
<form id="ubicar-{{ r.clave }}" method="post" action="{{ pagina }}" hidden>{% csrf_token %}<input type="hidden" name="ids" value="{{ r.id }}">{% if r.ref %}<input type="hidden" name="ref" value="{{ r.ref }}">{% endif %}{% if proyecto.id %}<input type="hidden" name="proyecto" value="{{ proyecto.id }}">{% endif %}<input type="hidden" name="filtros" value="{{ consulta_filtros }}"><input type="hidden" name="volver" value="{{ volver }}"></form>
