<form id="ejercicio-{{ e.id }}-editar" method="post" action="{{ pagina }}" hidden>{% csrf_token %}<input type="hidden" name="accion" value="editar_ejercicio"><input type="hidden" name="id" value="{{ e.id }}">{% if e.posicion_seccion %}<input type="hidden" name="posicion_actual" value="{{ e.posicion_seccion }}">{% endif %}<input type="hidden" name="filtros" value="{{ consulta_filtros }}"><input type="hidden" name="volver" value="{{ volver }}"></form>
<form id="ejercicio-{{ e.id }}-eliminar" method="post" action="{{ pagina }}" hidden>{% csrf_token %}<input type="hidden" name="accion" value="eliminar_ejercicios"><input type="hidden" name="sel" value="{{ e.id }}"><input type="hidden" name="filtros" value="{{ consulta_filtros }}"><input type="hidden" name="volver" value="{{ volver }}"></form>
