{% comment %}Asa para ordenar una sección, un ejercicio o una referencia: se arrastra o, con el foco, se mueve con ↑ ↓ (Inicio y Fin). Solo existe con JavaScript (resoluciones.js la muestra); sin él se ordena desde Editar.{% endcomment %}
<button class="asa" type="button" data-asa="{{ tabla }}" data-id="{{ objeto_id }}" hidden aria-label="Ordenar «{{ nombre }}»: arrástralo o usa las flechas arriba y abajo" title="Arrastra para ordenar · ↑ ↓ con el teclado"><svg viewBox="0 0 12 20" aria-hidden="true" focusable="false"><circle cx="3.5" cy="5" r="1.4"/><circle cx="8.5" cy="5" r="1.4"/><circle cx="3.5" cy="10" r="1.4"/><circle cx="8.5" cy="10" r="1.4"/><circle cx="3.5" cy="15" r="1.4"/><circle cx="8.5" cy="15" r="1.4"/></svg></button>
